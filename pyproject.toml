[project]
name = "data-vigia"
version = "1.0.0"
description = "Manutenção preditiva de uma máquina de usinagem (Indústria 4.0) com o dataset AI4I 2020"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-include = ["*.ipynb"]
extend-exclude = ["docs/plano"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "F401"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
