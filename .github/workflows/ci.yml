name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Testes
        run: pytest -q
      - name: Executa os notebooks de ponta a ponta
        run: |
          shopt -s nullglob
          for nb in notebooks/0*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute "$nb" --output-dir /tmp/nb \
              --ExecutePreprocessor.timeout=1200
            echo "::endgroup::"
          done
